    name = "Enlaces"
    title = "Recursos"
    url = "/blog/r_introduccion/recursos_r/"
    weight = 11

  [[menu.footer]]
    name = "Contacto"
    title = "Bastián Olea: Contacto"
    url = "/contacto/"
    weight = 1
  [[menu.footer]]
    name = "Sobre mi"
    title = "Bastián Olea: Sobre mi"
    url = "/about/"
    weight = 2
  [[menu.footer]]
    name = "Buscar"
    title = "Buscador"
    url = "/buscar/"
