baseURL = "https://bastianolea.rbind.io/"
theme = "hugo-apero"
defaultContentLanguage = "es"
title = "Bastián Olea"
author = "Bastián Olea Herrera"
copyright = "" # vacío: se genera automáticamente con orgName, orgLocal y el año
timeZone = "America/Santiago"
pagination.pagerSize = 20
buildFuture = true # publica posts con fecha futura
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.qmd$", "\\.knit\\.md$", "\\.utf8\\.md$", "/_freeze/", "/\\.quarto/"]
enableEmoji = true
enableRobotsTXT = true # plantilla en layouts/robots.txt
titleCaseStyle = "firstupper"

[languages]
  [languages.es]
    label = "Español"
    locale = "es-ES"
    weight = 1

[markup]
  [markup.goldmark.renderer]
    unsafe = true # permite HTML dentro del markdown
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    # estilos: https://xyproto.github.io/splash/docs/
    style = "rose-pine-moon"
    noClasses = false # usa el css personalizado de static/css/syntax.css
    # editar estilo con: https://gohugo.io/commands/hugo_gen_chromastyles/

[sitemap]
  changeFreq = "weekly"

[minify]
  minifyOutput = true

[params]
  orgName = "Bastián Olea Herrera"
  orgLocal = "Chile"
  description = "Tutoriales, guías y consejos de R en español para análisis y visualización de datos, con foco en ciencias sociales y datos de Chile."
  favicon = "/favicon.ico"
  logo = "/img/logo.png"
  mainSections = ["blog", "apps", "about"]
  navallcaps = true
  socialInHeader = true
  socialInFooter = true
  # imagen por defecto al compartir (ruta dentro de static/)
  sharing_image = "img/collage_horizontal_morado.jpg"
  twitter = "bastimapache" # sin @

  # paleta propia en assets/tema-morado-hex.scss
  custom_theme = "tema-morado-hex"

  customtextFontFamily = "Atkinson Hyperlegible"
  customheadingFontFamily = "EB Garamond"
  # respaldo usado por scaffold.scss
  textFontFamily = "sans-serif"
  headingFontFamily = "serif"

  goatcounter = "bastimapache"

  # "utterances" o "" (desactivados)
  comments = ""

  # utterances funciona, pero solo para personas con cuenta de GitHub
  [params.utterances]
    repo_name = "bastianolea/blog-R"
    issue_term = "pathname"
    theme = "github-light"
    label = "comments"

  [params.math]
    renderer = "katex"

  # íconos sociales del header y footer (fab = marcas, fas = sólidos)
  [[params.social]]
    icon = "search"
    name = "Buscar publicaciones"
    icon_pack = "fas"
    url = "/buscar/"
  [[params.social]]
    icon = "linkedin"
    name = "LinkedIn"
    icon_pack = "fab"
    url = "https://www.linkedin.com/in/bastianolea/"
  [[params.social]]
    icon = "github"
    name = "GitHub"
    icon_pack = "fab"
    url = "https://github.com/bastianolea"
  [[params.social]]
    icon = "twitter"
    name = "Twitter / X"
    icon_pack = "fab"
    url = "https://x.com/bastimapache"
  # [[params.social]]
  #   icon = "tiktok"
  #   icon_pack = "fab"
  #   url = "https://www.tiktok.com/@bastimapache"
  # [[params.social]]
  #   icon = "instagram"
  #   icon_pack = "fab"
  #   url = "https://www.instagram.com/raccunnie"
  # [[params.social]]
  #   icon = "goodreads"
  #   icon_pack = "fab"
  #   url = "https://www.goodreads.com/user/show/53224910-basti-n-olea-herrera"
  # [[params.social]]
  #   icon = "lastfm"
  #   icon_pack = "fab"
  #   url = "https://www.last.fm/user/bastimapache"
  # [[params.social]]
  #   icon = "bluesky"
  #   icon_pack = "fab"
  #   url = "https://bsky.app/profile/bastianolea.rbind.io"
  [[params.social]]
    icon = "heart"
    name = "Mi sitio personal"
    icon_pack = "fas"
    url = "https://bastimapache.cl"
  [[params.social]]
    icon = "coffee"
    name = "Regálame un cafecito"
    icon_pack = "fas"
    url = "https://buymeacoffee.com/bastimapache"
  [[params.social]]
    icon = "envelope"
    name = "Contacto"
    icon_pack = "fas"
    url = "/contacto/"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[menu]
  [[menu.header]]
    name = "Blog"
    title = "Bastián Olea: Blog de R"
    url = "/blog/"
    weight = 1
  [[menu.header]]
    name = "Aprende R"
    title = "Aprende R"
    url = "https://bastianolea.github.io/aprende_r/"
    weight = 2
  [[menu.header]]
    name = "Temas"
    title = "Temas"
    url = "/tags/"
    weight = 3.1
    [menu.header.params]
      dropdown = "tags"
      dropdown_n = 10
      # tags que no se muestran en el dropdown (nombre tal como va en el front matter)
      dropdown_exclude = ["blog", "chile"]
  [[menu.header]]
    name = "Apps"
    title = "Apps"
    url = "https://bastianolea.github.io/shiny_apps/"
    weight = 3.2
  [[menu.header]]
    name = "Datos"
    title = "Datos"
    url = "https://bastianolea.github.io/datos_sociales/"
    weight = 3.3
  [[menu.header]]
    name = "Tutoriales"
