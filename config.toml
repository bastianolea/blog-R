# https://gohugo.io/about/hugo-and-gdpr/
[privacy]
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
