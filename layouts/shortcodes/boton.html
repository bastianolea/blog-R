<!-- shortcode Hugo que agrega un botón con logo Font Awesome -->
<!-- 0 es el enlace, 1 es el texto, y 2 es el logo -->
<!-- El logo debe incluir "fab" si son logos de marcas, o "fas" si son los demás; por ejemplo, "fas fa-file-arrow-down" es un ícono de descarga -->

<div class = "db pt1"
style = "margin-bottom: 34px;">

<a class = "btn-links mr2 ba dib boton"
href = "{{.Get 1}}" target="_blank">
<i class="{{.Get 2 | default "fab fa-github"}} fa-lg fa-fw mr2"></i>
{{.Get 0 | markdownify }}</a>

</div>
