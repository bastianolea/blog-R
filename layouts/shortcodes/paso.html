<!-- fondo redondeado -->
<div style="display: flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%;
            background-color: #DEC4F2; border-radius: 28px;
            padding: 12px 20px 12px 14px;
            margin: 24px 4px 24px 12px;">

  <!-- círculo -->
  <div style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
              background-color: #9069C0; display: flex; align-items: center;
              justify-content: center;
              outline: solid 2px #EAD2FAAA;">
    <!-- número del círculo -->
    <span style="font-family: 'EB Garamond', Garamond, serif; color: #EAD2FA;
                font-size: 120%; font-weight: bold; margin-bottom: 1px;">{{ .Get 0 }}</span>
  </div>

  <!-- texto -->
  <div style="font-size: 100%;">
    <b>Paso {{ .Get 0}}:</b> 
    {{ .Get 1 | markdownify }}
  </div>

</div>
