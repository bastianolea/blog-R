<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0;
            margin: 8px 24px 8px 24px;">

  <div style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
              background-color: #9069C0; display: flex; align-items: center;
              justify-content: center;">
    <span style="font-family: 'EB Garamond', Garamond, serif; color: #EAD2FA;
                  font-size: 120%; font-weight: bold; margin-bottom: 1px;">{{ .Get 0 }}</span>
  </div>

  <div style="font-size: 100%;">
    <b>Paso {{ .Get 0}}:</b> {{ .Get 1 | markdownify }}
  </div>

</div>
